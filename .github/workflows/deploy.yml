name: 🚀 Deploy to Vercel

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo del deploy (es. nuovi lavori aggiunti)'
        required: false
        default: 'Manual redeploy'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        run: |
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
